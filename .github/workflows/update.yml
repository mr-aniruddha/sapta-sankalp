name: Daily price update

on:
  schedule:
    # 17:00 IST = 11:30 UTC, daily (after Indian market close at 15:30 IST)
    - cron: '30 11 * * *'
  workflow_dispatch:   # allows manual trigger from the Actions tab

env:
  # Opt into Node.js 24 now (Node 20 deprecated on GitHub Actions from June 2026)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write       # allow the bot to commit the updated JSON

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run fetcher
        run: python scripts/fetch.py

      - name: Commit updated data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name  "github-actions[bot]"
          git add data/prices.json data/fuel-prices.json data/tourism-nav.json data/news.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "data: daily update $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
